<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JPSME">
  <!--
    Stands in until a favicon is uploaded from Admin - Settings, and exists
    mainly so /favicon.ico stops 404ing on every page load.

    Deliberately not a shrunk copy of the seal. At 16px the seal's ring of
    lettering turns into a grey smudge, so this keeps only what survives that
    size: the gear silhouette, the gold-on-navy, and the cross.
  -->
  <rect width="64" height="64" rx="12" fill="#1a1f71"/>
  <g fill="#f5c518">
    <!-- Gear teeth: twelve blocks around the rim, drawn as rotated copies. -->
    <g>
      <rect x="30" y="6" width="4" height="7" rx="1"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(30 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(60 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(90 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(120 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(150 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(180 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(210 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(240 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(270 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(300 32 32)"/>
      <rect x="30" y="6" width="4" height="7" rx="1" transform="rotate(330 32 32)"/>
    </g>
    <circle cx="32" cy="32" r="21" fill="none" stroke="#f5c518" stroke-width="5"/>
    <!-- The cross and hub, which is what still reads at 16 pixels. -->
    <rect x="29.5" y="14" width="5" height="36" rx="1"/>
    <rect x="14" y="29.5" width="36" height="5" rx="1"/>
    <circle cx="32" cy="32" r="8" fill="#1a1f71" stroke="#f5c518" stroke-width="4"/>
  </g>
</svg>
