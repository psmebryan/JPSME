<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    The technical-drawing texture behind the home page hero, as a seamless
    400x400 tile.

    Drawn rather than photographed on purpose. The artwork it stands in for is a
    raster banner, and on this host an uploaded file is wiped by the next deploy
    — this ships with the code, scales to any screen without going soft, and
    weighs a couple of kilobytes. An uploaded hero image, when one is set,
    covers it.

    Everything is one stroke colour at low opacity so it can sit over any
    gradient: the tile carries no background of its own.

    Seamlessness: every shape that touches an edge is repeated at the opposite
    edge, so the 400-unit repeat has no visible seam.
  -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1">

    <!-- Grid, the substrate of any drafting sheet. -->
    <g stroke-opacity="0.12">
      <path d="M0 50H400M0 150H400M0 250H400M0 350H400"/>
      <path d="M50 0V400M150 0V400M250 0V400M350 0V400"/>
    </g>

    <!-- Large flange, top-left: bolt circle, hub, keyway. -->
    <circle cx="96" cy="104" r="58"/>
    <circle cx="96" cy="104" r="46"/>
    <circle cx="96" cy="104" r="17"/>
    <path d="M88 87h16v-9H88z"/>
    <g stroke-opacity="0.38">
      <circle cx="96" cy="66" r="5"/><circle cx="134" cy="104" r="5"/>
      <circle cx="96" cy="142" r="5"/><circle cx="58" cy="104" r="5"/>
      <circle cx="123" cy="77" r="5"/><circle cx="123" cy="131" r="5"/>
      <circle cx="69" cy="131" r="5"/><circle cx="69" cy="77" r="5"/>
    </g>
    <!-- Centre lines, the giveaway that this is a drawing and not a logo. -->
    <g stroke-opacity="0.3" stroke-dasharray="14 5 3 5">
      <path d="M96 34V174M26 104H166"/>
    </g>

    <!-- Spur gear, right side. Teeth as a dashed rim reads correctly at this
         scale and costs a fraction of the path data of real involutes. -->
    <circle cx="300" cy="150" r="52" stroke-dasharray="9 7"/>
    <circle cx="300" cy="150" r="44"/>
    <circle cx="300" cy="150" r="14"/>
    <g stroke-opacity="0.3" stroke-dasharray="14 5 3 5">
      <path d="M300 86v128M236 150h128"/>
    </g>

    <!-- Shaft assembly, bottom-left: stepped diameters in section. -->
    <path d="M24 300h92v34H24zM116 292h74v50h-74zM190 302h96v30h-96z"/>
    <g stroke-opacity="0.28">
      <path d="M24 317h262"/>
    </g>
    <!-- Hatching on one step, the way a sectioned part is marked up. -->
    <g stroke-opacity="0.22">
      <path d="M120 342l50-50M132 342l50-50M144 342l46-46M156 342l34-34"/>
    </g>

    <!-- Dimension line with arrow ticks and extension lines. -->
    <g stroke-opacity="0.3">
      <path d="M24 360v16M286 360v16M24 368h262"/>
      <path d="M30 364l-6 4 6 4M280 364l6 4-6 4"/>
    </g>

    <!-- Bracket detail, bottom-right, with a fillet and two fixing holes. -->
    <path d="M318 250h60v26h-34v66h-26z"/>
    <path d="M344 276a26 26 0 0 1 0 0"/>
    <g stroke-opacity="0.38">
      <circle cx="334" cy="262" r="6"/><circle cx="364" cy="262" r="6"/>
    </g>

    <!-- Bearing, top edge - repeated at the bottom edge so the tile joins. -->
    <g>
      <circle cx="228" cy="0" r="30"/><circle cx="228" cy="0" r="19"/>
      <circle cx="228" cy="400" r="30"/><circle cx="228" cy="400" r="19"/>
    </g>

    <!-- Rail, left edge - repeated at the right edge for the same reason. -->
    <g>
      <path d="M0 196h44v22H0zM0 202h36"/>
      <path d="M400 196h-44v22h44zM400 202h-36"/>
    </g>

  </g>
</svg>
